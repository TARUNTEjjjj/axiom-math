name: C++ checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the configuration-less install regression covered in CI.
          - os: ubuntu-latest
            compiler: g++
            type: ''
            sanitizers: OFF
            shared: OFF
          - os: ubuntu-latest
            compiler: g++
            type: Release
            sanitizers: OFF
            shared: OFF
            # Global flags also reach the configure-time __int128 check, which
            # GCC must still pass with pedantic diagnostics as errors.
            configure_args: -DCMAKE_CXX_FLAGS=-pedantic-errors
          - os: ubuntu-latest
            compiler: clang++
            type: Debug
            sanitizers: ON
            shared: OFF
          - os: macos-latest
            compiler: clang++
            type: Release
            sanitizers: OFF
            shared: OFF
          - os: ubuntu-latest
            compiler: g++
            type: Release
            sanitizers: OFF
            shared: ON
            install_bindir: tools/bin
            install_libdir: lib64
            install_includedir: headers
            # find_package does not search lib64 on Debian-family Linux, so the
            # CMake package goes in share here, wherever the data directory is.
            configure_args: -DCMAKE_INSTALL_DATAROOTDIR=tools/share
          - os: macos-latest
            compiler: clang++
            type: Release
            sanitizers: OFF
            shared: ON
            install_bindir: tools/bin
            install_libdir: lib64
            install_includedir: headers
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.type }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DAXIOM_MATH_SANITIZERS=${{ matrix.sanitizers }}
          -DAXIOM_MATH_WARNINGS_AS_ERRORS=ON
          -DCMAKE_INSTALL_BINDIR=${{ matrix.install_bindir || 'bin' }}
          -DCMAKE_INSTALL_LIBDIR=${{ matrix.install_libdir || 'lib' }}
          -DCMAKE_INSTALL_INCLUDEDIR=${{ matrix.install_includedir || 'include' }}
          ${{ matrix.configure_args }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
